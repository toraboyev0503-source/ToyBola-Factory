name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ]; then
            echo "dir=$PWD" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 3 -type f -name 'ToyBola_Factory_Source_*.zip' | sort -V | tail -n 1)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "Android source ZIP not found." >&2
            exit 1
          fi

          unzip -t "$ZIP_FILE" >/dev/null
          rm -rf _android_source
          mkdir -p _android_source
          unzip -q "$ZIP_FILE" -d _android_source

          SETTINGS=$(find _android_source -type f -name settings.gradle.kts | head -n 1)
          if [ -z "${SETTINGS:-}" ]; then
            echo "settings.gradle.kts not found inside source ZIP." >&2
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle wrapper --gradle-version 9.5.0
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew test --stacktrace

      - name: Android lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: ToyBola-0.2.0-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
