name: ToyBola Build + Firebase Deploy

on:
  workflow_dispatch:
    inputs:
      bootstrap_admin:
        description: "Bir martalik bosh administratorni yaratish"
        required: false
        default: false
        type: boolean
      provision_user:
        description: "Legacy/favqulodda pilot provision (odatda Admin menyudan yaratiladi)"
        required: false
        default: false
        type: boolean
      provision_name:
        description: "Pilot foydalanuvchi ismi"
        required: false
        default: ""
        type: string
      provision_role:
        description: "Pilot foydalanuvchi roli"
        required: false
        default: "BRIGADIR"
        type: choice
        options:
          - BRIGADIR
          - QUALITY
          - TP_NACHALNIK
          - TP_PLAN
          - TP_BRIGADIR
          - TP_SERYO
          - TP_QABUL
          - TP_QUALITY
          - RAHBAR
          - ADMIN
      provision_brigades:
        description: "Brigada ID lar (vergul bilan)"
        required: false
        default: ""
        type: string
      provision_all_brigades:
        description: "Barcha brigadalarga ruxsat"
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  android:
    name: Android test, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK root not found: $SDK_ROOT" >&2
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 | sort -V | tail -n 1)
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
